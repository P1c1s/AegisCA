services:
  aegis-ca:
    image: ghcr.io/p1c1s/aegis-ca:latest
    container_name: aegis-ca
    hostname: aegis-ca
    restart: always
    environment:
      - TZ=Europe/Rome
      - DB_NAME=aegis_ca
      - DB_USER=admin
      - DB_PASS=your_srecret!
    ports:
      - "8080:80"
    volumes:
          - aegis-ca_data:/data

volumes:
  aegis-ca_data:
